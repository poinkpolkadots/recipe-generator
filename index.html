<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <title>Recipe Generator</title>
</head>
<body>
    <main>
        <div id="inline-wrapper">
            <h1 class="title">Generate a Recipe Idea!</h1>
            <a id="button">Generate an idea!</a>
        </div>
        <div id="result">
            <p class="title">Flavors</p>
            <p id="flavor1"></p>
            <p id="flavor2"></p>
            <p id="flavor3"></p>
            <p class="title">Category</p>
            <p id="category-text"></p>
        </div>
    </main>
    <footer><p>Add to the list of ideas <a href="https://github.com/poinkpolkadots/recipe-generator">here</a>!</p></footer>
</body>
</html>
